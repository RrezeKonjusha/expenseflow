          type: string
          minLength: 1
          description: Uppercase letters, digits, dash
          pattern: ^[A-Z0-9-]{2,20}$
        name:
          type: string
          minLength: 1
          maxLength: 150
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_active:
          type: boolean
      required:
      - budget
      - code
      - name
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 10
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - password
    ReimburseRequest:
