        description:
          type: string
          minLength: 1
          maxLength: 500
        project:
          type: integer
        distance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,1})?$
        destination:
          type: string
          minLength: 1
          maxLength: 150
        attendees:
          type: integer
          maximum: 500
          minimum: 1
        item_name:
          type: string
          minLength: 1
          maxLength: 150
