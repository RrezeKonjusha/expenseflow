      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/reports/dashboard/:
    get:
      operationId: v1_reports_dashboard_retrieve
      tags:
      - Reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /api/v1/reports/run/:
    post:
      operationId: v1_reports_run_create
      tags:
      - Reports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriteriaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CriteriaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CriteriaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResult'
          description: ''
  /api/v1/users/:
    get:
      operationId: v1_users_list
      parameters:
      - in: query
        name: department
        schema:
          type: integer
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - ADMIN
          - MANAGER
          - USER
        description: |-
          * `USER` - Employee
          * `MANAGER` - Manager
          * `ADMIN` - Admin
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: v1_users_create
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/users/{id}/:
    get:
      operationId: v1_users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: v1_users_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: v1_users_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: v1_users_destroy
      description: Deactivates the user (soft delete).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Users
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    Access:
      type: object
      properties:
        access:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - user
    AuditLog:
      type: object
      properties:
        id:
          type: string
        ts:
          type: string
          format: date-time
        action:
          type: string
        actor:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        target:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        changes:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        ip:
          type: string
          nullable: true
        request_id:
          type: string
          nullable: true
      required:
      - action
      - actor
      - changes
      - id
      - ip
      - request_id
      - target
      - ts
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_password
    Criteria:
      type: object
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        group_by:
          $ref: '#/components/schemas/GroupByEnum'
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseStatusEnum'
        types:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseTypeEnum'
        department_ids:
          type: array
          items:
            type: integer
            minimum: 1
        project_ids:
          type: array
          items:
            type: integer
            minimum: 1
      required:
      - date_from
      - date_to
      - group_by
    CriteriaRequest:
      type: object
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        group_by:
          $ref: '#/components/schemas/GroupByEnum'
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseStatusEnum'
        types:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseTypeEnum'
        department_ids:
          type: array
          items:
            type: integer
            minimum: 1
        project_ids:
          type: array
          items:
            type: integer
            minimum: 1
      required:
      - date_from
      - date_to
      - group_by
    Dashboard:
      type: object
      properties:
        scope:
          type: string
        counts:
          type: object
          additionalProperties:
            type: integer
        spent_this_month:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        pending_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        monthly:
          type: array
          items:
            type: object
            additionalProperties: {}
        by_type:
          type: array
          items:
            type: object
            additionalProperties: {}
        generated_at:
          type: string
          format: date-time
      required:
      - by_type
      - counts
      - generated_at
      - monthly
      - pending_amount
      - scope
      - spent_this_month
    Department:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        manager:
          type: integer
          nullable: true
        manager_name:
          type: string
          readOnly: true
        member_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - manager_name
      - member_count
      - name
    DepartmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        manager:
          type: integer
          nullable: true
      required:
      - name
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Expense:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          $ref: '#/components/schemas/ExpenseTypeEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/ExpenseStatusEnum'
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        currency:
          type: string
          readOnly: true
        expense_date:
          type: string
          format: date
        description:
          type: string
          maxLength: 500
        project:
          type: integer
        project_code:
          type: string
          readOnly: true
        employee:
          type: integer
          readOnly: true
        employee_name:
          type: string
          readOnly: true
        department_name:
          type: string
          readOnly: true
        distance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,1})?$
        destination:
          type: string
          maxLength: 150
        attendees:
          type: integer
          maximum: 500
          minimum: 1
        item_name:
          type: string
          maxLength: 150
        serial_no:
          type: string
          maxLength: 100
        reimbursable_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        decided_by:
          type: integer
          readOnly: true
          nullable: true
        decided_by_name:
          type: string
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        rejection_reason:
          type: string
          readOnly: true
        reimbursed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        _links:
          type: object
          additionalProperties:
            type: object
            properties:
              href:
                type: string
              method:
                type: string
          readOnly: true
          title: ' links'
      required:
      - _links
      - amount
      - created_at
      - currency
      - decided_at
      - decided_by
      - decided_by_name
      - department_name
      - description
      - employee
      - employee_name
      - expense_date
      - id
      - project
      - project_code
      - reimbursable_amount
      - reimbursed_at
      - rejection_reason
      - status
      - submitted_at
      - type
      - updated_at
    ExpenseRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ExpenseTypeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        expense_date:
          type: string
          format: date
        description:
          type: string
          minLength: 1
          maxLength: 500
        project:
          type: integer
        distance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,1})?$
        destination:
          type: string
          minLength: 1
          maxLength: 150
        attendees:
          type: integer
          maximum: 500
          minimum: 1
        item_name:
          type: string
          minLength: 1
          maxLength: 150
        serial_no:
          type: string
          maxLength: 100
      required:
      - amount
      - description
      - expense_date
      - project
      - type
    ExpenseStatusEnum:
      enum:
      - DRAFT
      - SUBMITTED
      - APPROVED
      - REJECTED
      - REIMBURSED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `SUBMITTED` - Submitted
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
        * `REIMBURSED` - Reimbursed
    ExpenseTypeEnum:
      enum:
      - TRAVEL
      - MEAL
      - EQUIPMENT
      type: string
      description: |-
        * `TRAVEL` - Travel
        * `MEAL` - Meal
        * `EQUIPMENT` - Equipment
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    GroupByEnum:
      enum:
      - department
      - employee
      - month
      - project
      - status
      - type
      type: string
      description: |-
        * `department` - department
        * `employee` - employee
        * `month` - month
        * `project` - project
        * `status` - status
        * `type` - type
    ImportRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    ImportResult:
      type: object
      properties:
        created:
          type: integer
        created_ids:
          type: array
          items:
            type: integer
        errors:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - created
      - created_ids
      - errors
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        department:
          type: integer
          readOnly: true
          nullable: true
        department_name:
          type: string
          readOnly: true
      required:
      - department
      - department_name
      - email
      - full_name
      - id
      - role
    PaginatedAuditLogList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
