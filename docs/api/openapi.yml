          minLength: 1
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - token
      - uid
    RoleEnum:
      enum:
      - USER
      - MANAGER
      - ADMIN
      type: string
      description: |-
        * `USER` - Employee
        * `MANAGER` - Manager
        * `ADMIN` - Admin
    Row:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        count:
          type: integer
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - count
      - key
      - label
      - total
    SaveReportRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        criteria:
          $ref: '#/components/schemas/CriteriaRequest'
      required:
      - criteria
      - name
    Snapshot:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        owner:
          type: object
          additionalProperties: {}
          readOnly: true
        scope:
          type: string
        criteria:
          type: object
          additionalProperties: {}
          readOnly: true
        rows:
          type: array
          items:
            $ref: '#/components/schemas/Row'
        totals:
          $ref: '#/components/schemas/Totals'
        generated_at:
          type: string
          format: date-time
      required:
      - criteria
      - generated_at
      - id
      - name
      - owner
      - rows
      - scope
      - totals
    Totals:
      type: object
      properties:
        count:
          type: integer
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - count
      - total
    UidTokenRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
      required:
      - token
      - uid
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        department:
          type: integer
          nullable: true
        department_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - department_name
      - email
      - full_name
      - id
      - last_login
    UserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        department:
          type: integer
          nullable: true
        is_active:
          type: boolean
        password:
          type: string
          writeOnly: true
      required:
      - email
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
