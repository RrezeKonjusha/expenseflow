  /api/v1/expenses/:
    get:
      operationId: v1_expenses_list
      description: Expenses visible to the caller (own, department, or all by role).
      parameters:
      - in: query
        name: amount_max
        schema:
          type: number
      - in: query
        name: amount_min
        schema:
          type: number
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: department
        schema:
          type: number
      - in: query
        name: employee
        schema:
          type: number
      - in: query
        name: mine
        schema:
          type: boolean
        description: Only my own expenses
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: number
      - in: query
        name: q
        schema:
          type: string
        description: Full-text search in description
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - APPROVED
            - DRAFT
            - REIMBURSED
            - REJECTED
            - SUBMITTED
        description: |-
          * `DRAFT` - Draft
          * `SUBMITTED` - Submitted
          * `APPROVED` - Approved
          * `REJECTED` - Rejected
          * `REIMBURSED` - Reimbursed
        explode: true
        style: form
      - in: query
        name: type
        schema:
          type: array
          items:
            type: string
            enum:
            - EQUIPMENT
            - MEAL
            - TRAVEL
        description: |-
          * `TRAVEL` - Travel
          * `MEAL` - Meal
          * `EQUIPMENT` - Equipment
        explode: true
        style: form
      tags:
      - Expenses
      security:
      - jwtAuth: []
      responses:
