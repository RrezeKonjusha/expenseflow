    delete:
      operationId: v1_reports_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Reports
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/reports/{id}/export/:
    get:
      operationId: v1_reports_export_retrieve
      parameters:
