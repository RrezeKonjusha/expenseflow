name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint + unit + integration
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: expenseflow, POSTGRES_USER: expenseflow, POSTGRES_PASSWORD: expenseflow }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U expenseflow" --health-interval 5s --health-retries 10
      # real MongoDB and Redis: the suite runs against them, and `real_services` tests are enabled
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://expenseflow:expenseflow@localhost:5432/expenseflow
      TEST_MONGO_URL: mongodb://localhost:27017/expenseflow_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Architecture contracts (layers between modules)
        run: lint-imports
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env: { DJANGO_SETTINGS_MODULE: config.settings_test }
      - name: Tests with coverage gate (80%)
        run: pytest --create-db --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: backend/coverage.xml }

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        env: { CYPRESS_INSTALL_BINARY: 0 }
      - run: npm run lint
      - run: npm run build
      - name: Storybook builds (component-driven development)
        run: npm run build-storybook

  e2e:
    name: Test environment (Docker) + Newman + Cypress
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
          for _ in $(seq 1 60); do curl -skf https://localhost/health/ && break; sleep 3; done
          docker compose exec -T api python manage.py seed_demo --reset
      - name: API contract tests (Newman)
        run: npx --yes newman@6 run tests/postman/expenseflow.postman_collection.json -e tests/postman/ci.postman_environment.json --insecure --reporters cli,junit --reporter-junit-export newman.xml
      - name: E2E (Cypress)
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          browser: chrome
        env:
          CYPRESS_BASE_URL: https://localhost
          CYPRESS_MAILPIT_URL: http://localhost:8025
      - name: Session survives rapid reloads (real Chrome, no proxy)
        working-directory: tests/browser
        run: |
          npm i --no-save --no-package-lock puppeteer-core@24
          CHROME_PATH=$(which google-chrome) BASE_URL=https://localhost node refresh-race.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            newman.xml
            frontend/cypress/videos
            frontend/cypress/screenshots
      - if: failure()
        run: docker compose logs --tail=200 api worker web
