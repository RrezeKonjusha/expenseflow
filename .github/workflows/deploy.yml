name: Deploy

# main -> https://<domain> (production). There is no staging server: the ephemeral Docker stack in the CI
# e2e job is the test and staging environment. Secrets live in the `production` environment:
# VPS_HOST, VPS_USER, VPS_SSH_KEY, DOMAIN. The server keeps its own .env.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.vars.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.vars.outputs.registry }}/api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.vars.outputs.registry }}/web:${{ github.sha }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      STACK: prod
      HOST: ${{ secrets.DOMAIN }}
      CONFIGURED: ${{ secrets.VPS_HOST != '' }}
    steps:
      - name: Skip until the server is set up
        if: env.CONFIGURED != 'true'
        run: echo "::notice::VPS_HOST is not set in the production environment yet, so the deploy is skipped (see docs/deployment.md)."
      - name: Deploy over SSH
        if: env.CONFIGURED == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: STACK
          script: |
            set -e
            cd ~/expenseflow-$STACK
            git pull --ff-only
            export IMAGE_TAG=${{ github.sha }} REGISTRY=${{ needs.images.outputs.registry }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -p $STACK -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -p $STACK -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
      - name: Smoke check
        if: env.CONFIGURED == 'true'
        run: |
          for i in $(seq 1 30); do curl -fs "https://$HOST/health/" && exit 0; sleep 5; done
          exit 1
