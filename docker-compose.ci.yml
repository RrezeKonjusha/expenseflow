# Ephemeral test environment inside GitHub Actions.
services:
  api:
    environment:
      EMAIL_URL: smtp://mailpit:1025
      THROTTLE_AUTH: 1000/min
      THROTTLE_ANON: 1000/min  # refresh calls are anonymous; e2e and browser tests make many
      AXES_ENABLED: "0"
  worker:
    environment:
      EMAIL_URL: smtp://mailpit:1025
  mailpit:
    image: axllent/mailpit:v1.20
    ports: ["8025:8025"]
  prometheus:
    profiles: [monitoring]
  grafana:
    profiles: [monitoring]
